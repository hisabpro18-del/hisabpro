# Local Postgres for development: `npm run db:local` (data kept in the hisabpro_pgdata volume)
services:
  db:
    image: postgres:16-alpine
    container_name: hisabpro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hisabpro
    ports:
      - "54330:5432"
    volumes:
      - hisabpro_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  hisabpro_pgdata:
